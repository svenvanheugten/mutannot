name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write # required for NuGet login

jobs:
  # Gate publishing on both platform builds (tests included) passing for the
  # tagged commit.
  linux:
    uses: ./.github/workflows/linux-tests.yml

  windows:
    uses: ./.github/workflows/windows-tests.yml

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Derive tool version from tag
        run: echo "TOOL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pack tool
        run: dotnet pack Mutannot/Mutannot.fsproj -c Release -p:Version="$TOOL_VERSION" -o out

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: svenvanheugten

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "out/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
