name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # required to create the GitHub release
  id-token: write # required for NuGet login

jobs:
  # Gate publishing on the full CI suite (both platforms, tests included)
  # passing for the tagged commit.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Derive tool version from tag
        run: echo "TOOL_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Pack tool
        run: dotnet pack Mutannot/Mutannot.fsproj -c Release -p:Version="$TOOL_VERSION" -o out

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: svenvanheugten

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "out/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Extract release notes from CHANGELOG
        run: |
          awk -v ver="$TOOL_VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found = 1; next }
            }
            found && /^\[.*\]:/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG entry found for $TOOL_VERSION" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
